<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Playhouse — Watch &amp; Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="menuToggle" aria-label="Toggle menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a class="logo" href="/">
        <span class="logo-mark">▶</span>
        <span class="logo-word">Playhouse</span>
      </a>
    </div>

    <div class="topbar-search">
      <input type="text" placeholder="Search tutorials, talks, deep-dives…" aria-label="Search" />
      <button class="search-btn" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="topbar-right">
      <button class="icon-btn" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="avatar">SA</div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav>
        <a class="nav-item active" href="#">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v10h14V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Home</span>
        </a>
        <a class="nav-item" href="#">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Explore</span>
        </a>
        <a class="nav-item" href="#">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Queue</span>
        </a>
        <a class="nav-item" href="#">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0112 6a5.5 5.5 0 019.5 6c-2.5 4.5-9.5 9-9.5 9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span>Saved</span>
        </a>
      </nav>
      <div class="sidebar-divider"></div>
      <p class="sidebar-label">Channels</p>
      <nav>
        <a class="nav-item" href="#"><span class="dot" style="background:#f2a154"></span><span>Backend Weekly</span></a>
        <a class="nav-item" href="#"><span class="dot" style="background:#7cc4a3"></span><span>Container Corner</span></a>
        <a class="nav-item" href="#"><span class="dot" style="background:#c893d6"></span><span>ShipIt Live</span></a>
      </nav>
    </aside>

    <main class="content">
      <div class="chips">
        <button class="chip active">All</button>
        <button class="chip">Docker</button>
        <button class="chip">Compose</button>
        <button class="chip">Kubernetes</button>
        <button class="chip">CI/CD</button>
        <button class="chip">Node.js</button>
        <button class="chip">Live</button>
      </div>

      <section class="grid" id="videoGrid">
        <!-- video cards injected by script.js -->
      </section>
    </main>
  </div>

  <script src="/script.js"></script>
</body>
</html>
