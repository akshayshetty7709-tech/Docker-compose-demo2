# Common proxy settings reused by every server block
map $host $x_forwarded_proto {
    default "http";
}

# ---------- service-a: Playhouse (video platform) ----------
server {
    listen 80;
    server_name video.localhost;

    location / {
        proxy_pass http://service-a:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    }
}

# ---------- service-b: ControlDeck (devops dashboard) ----------
server {
    listen 80;
    server_name devops.localhost;

    location / {
        proxy_pass http://service-b:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    }
}

# ---------- service-c: Deskyard (e-commerce portal) ----------
server {
    listen 80;
    server_name shop.localhost;

    location / {
        proxy_pass http://service-c:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    }
}

# ---------- fallback: unmatched hostnames ----------
server {
    listen 80 default_server;
    server_name _;

    return 404 "No app configured for this host. Try video.localhost, devops.localhost, or shop.localhost\n";
}
