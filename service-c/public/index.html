<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deskyard — Considered goods for your workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

  <header class="topbar">
    <a class="logo" href="/">Deskyard</a>
    <nav class="topnav">
      <a href="#" class="active">All goods</a>
      <a href="#">Desks</a>
      <a href="#">Seating</a>
      <a href="#">Lighting</a>
      <a href="#">Accessories</a>
    </nav>
    <div class="topbar-right">
      <button class="icon-btn" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="cart-btn" id="cartBtn" aria-label="Cart">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2.4 12.4a2 2 0 002 1.6h8.6a2 2 0 002-1.6L21 8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="21" r="1.5" fill="currentColor"/><circle cx="18" cy="21" r="1.5" fill="currentColor"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <p class="eyebrow">Autumn restock</p>
      <h1>Furniture &amp; fittings for a workspace worth showing up to.</h1>
      <p class="hero-sub">Solid materials, quiet colors, twenty-year builds. Free shipping over $150.</p>
    </div>
  </section>

  <main class="content">
    <div class="toolbar">
      <div class="filters" id="filters">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="Desks">Desks</button>
        <button class="filter-chip" data-filter="Seating">Seating</button>
        <button class="filter-chip" data-filter="Lighting">Lighting</button>
        <button class="filter-chip" data-filter="Accessories">Accessories</button>
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="featured">Featured</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
      </select>
    </div>

    <section class="grid" id="productGrid"></section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/script.js"></script>
</body>
</html>
